name: Tests Simples

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]
  workflow_dispatch:  # Permet de déclencher manuellement

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout du code
      uses: actions/checkout@v3
    
    - name: Configuration Python 3.10
      uses: actions/setup-python@v4
      with:
        python-version: "3.10"
        cache: 'pip'
    
    - name: Installation des dépendances
      run: |
        cd extension_finale
        python -m pip install --upgrade pip
        pip install -r Test/requirements_test.txt
    
    - name: Exécution des tests unitaires
      run: |
        cd extension_finale
        pytest Test/tests/unit/ -v --tb=short
    
    - name: Exécution des tests de scraping
      run: |
        cd extension_finale
        pytest Test/tests/functional/test_scraper_service.py -v --tb=short
    
    - name: Résumé des tests
      if: always()
      run: |
        echo "✅ Tests terminés"
        echo "📊 Consultez les logs ci-dessus pour les détails"




