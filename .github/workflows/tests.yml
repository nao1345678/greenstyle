name: Tests CI/CD

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        python-version: ["3.9", "3.10", "3.11"]
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Configuration Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}
    
    - name: Installation des dépendances système
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential
    
    - name: Installation des dépendances Python
      run: |
        cd extension_finale
        python -m pip install --upgrade pip
        pip install -r Test/requirements_test.txt
        # Installer aussi les dépendances du projet si elles existent
        if [ -f requirements.txt ]; then
          pip install -r requirements.txt
        fi
        if [ -f ../requirements.txt ]; then
          pip install -r ../requirements.txt
        fi
    
    - name: Exécution des tests unitaires
      run: |
        cd extension_finale
        pytest Test/tests/unit/ -v --tb=short
    
    - name: Exécution des tests fonctionnels (sans MongoDB)
      run: |
        cd extension_finale
        pytest Test/tests/functional/test_scraper_service.py -v --tb=short
        # Tests API qui ne nécessitent pas MongoDB
        pytest Test/tests/functional/test_brand_routes.py::TestBrandRoutes::test_root_endpoint -v --tb=short || true
        pytest Test/tests/functional/test_brand_routes.py::TestBrandRoutes::test_health_endpoint -v --tb=short || true
    
    - name: Rapport de couverture (si disponible)
      run: |
        cd extension_finale
        pytest Test/tests/unit/ --cov=src --cov-report=xml --cov-report=term-missing || true
      continue-on-error: true
    
    - name: Upload coverage reports
      uses: codecov/codecov-action@v3
      with:
        file: ./extension_finale/coverage.xml
        flags: unittests
        name: codecov-umbrella
        fail_ci_if_error: false
      continue-on-error: true

  lint:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Configuration Python
      uses: actions/setup-python@v4
      with:
        python-version: "3.10"
    
    - name: Installation des outils de linting
      run: |
        pip install flake8 pylint black isort
    
    - name: Vérification du formatage avec Black
      run: |
        cd extension_finale
        black --check src/ Test/tests/ || true
      continue-on-error: true
    
    - name: Vérification avec Flake8
      run: |
        cd extension_finale
        flake8 src/ Test/tests/ --max-line-length=120 --ignore=E501,W503 || true
      continue-on-error: true


