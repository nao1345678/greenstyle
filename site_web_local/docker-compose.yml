version: '3.8'

services:
  # Base de données MongoDB
  mongodb:
    image: mongo:6.0
    container_name: greenstyle_mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    environment:
      MONGO_INITDB_DATABASE: greenstyle_DB
    networks:
      - greenstyle_network
    restart: unless-stopped

  # Backend API FastAPI
  backend:
    build:
      context: ../extension_finale
      dockerfile: Dockerfile
    container_name: greenstyle_backend
    ports:
      - "8000:8000"
    depends_on:
      - mongodb
    environment:
      MONGO_URL: mongodb://mongodb:27017/greenstyle
      MONGO_DB: greenstyle_DB
    volumes:
      - ../extension_finale:/app
    networks:
      - greenstyle_network
    restart: unless-stopped
    command: uvicorn src.main:app --host 0.0.0.0 --port 8000 --reload

  # Frontend Vue.js
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: greenstyle_frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    environment:
      VITE_API_URL: http://backend:8000
    networks:
      - greenstyle_network
    restart: unless-stopped

volumes:
  mongodb_data:

networks:
  greenstyle_network:
    driver: bridge


