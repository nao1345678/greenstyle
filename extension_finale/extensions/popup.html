<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GreenStyle - Durabilité</title>
    <link rel="stylesheet" href="popup.css">
</head>
<body class="greenstyle-popup">
    <!-- Info page actuelle -->
    <div class="current-page-info" id="current-page-info" style="display: none;">
        <strong>📄 Page analysée :</strong><br/>
        <span id="current-url">Chargement...</span>
    </div>

    <!-- Message de chargement -->
    <div id="loading" class="loading">
        <p>Analyse de la page en cours...</p>
    </div>

    <!-- Message aucune marque -->
    <div id="no-brands" class="no-brands" style="display: none;">
        <p style="margin-bottom: 10px;">Aucune marque détectée sur cette page</p>
        <p style="font-size: 12px;">
            Visitez un site e-commerce (Zalando, ASOS, etc.) pour voir les marques détectées
        </p>
    </div>

    <!-- Liste des marques détectées -->
    <div id="brands-list" class="brands-list"></div>

    <script src="popup.js"></script>
</body>
</html>
